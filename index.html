<title>Plan de Vuelo 247 · SEEC 2027</title>
<style>
:root{--bg:#040a18;--bg2:#0b1a3a;--card:rgba(22,38,78,.55);--card2:rgba(255,255,255,.07);--line:rgba(130,180,255,.17);--text:#eaf2ff;--sub:#8ea5cf;--cyan:#22e6ff;--blue:#3b82f6;--amber:#ffb020;--green:#30d158;--red:#ff453a;--violet:#c084fc;--tab:rgba(8,16,38,.72);--sheet:rgba(12,24,54,.93);--shadow:0 10px 30px rgba(0,0,0,.35);--frame:#15181f;--page:#010309;--on:#00131c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#e9f1fc;--bg2:#cfe0f8;--card:rgba(255,255,255,.72);--card2:rgba(10,30,70,.06);--line:rgba(30,70,140,.14);--text:#0b1730;--sub:#5a6b8c;--cyan:#0a8fb0;--blue:#2563eb;--amber:#c97800;--green:#1f9d47;--red:#d92d20;--violet:#7c3aed;--tab:rgba(255,255,255,.78);--sheet:rgba(248,251,255,.94);--shadow:0 10px 28px rgba(30,60,120,.16);--frame:#d7dce6;--page:#dfe8f5;--on:#fff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){--bg:#e9f1fc;--bg2:#cfe0f8;--card:rgba(255,255,255,.72);--card2:rgba(10,30,70,.06);--line:rgba(30,70,140,.14);--text:#0b1730;--sub:#5a6b8c;--cyan:#0a8fb0;--blue:#2563eb;--amber:#c97800;--green:#1f9d47;--red:#d92d20;--violet:#7c3aed;--tab:rgba(255,255,255,.78);--sheet:rgba(248,251,255,.94);--shadow:0 10px 28px rgba(30,60,120,.16);--frame:#d7dce6;--page:#dfe8f5;--on:#fff}}
:root[data-theme="dark"]{color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:radial-gradient(1200px 700px at 50% 0%,var(--bg2),var(--page));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;background-color:var(--page)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#app{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.wrap{position:relative}
.phone{position:absolute;left:0;top:0;width:393px;height:852px;transform-origin:0 0;border-radius:64px;background:var(--frame);padding:11px;box-shadow:0 0 0 2px rgba(120,130,150,.5),0 40px 100px rgba(0,0,0,.55)}
.screen{position:relative;width:100%;height:100%;border-radius:53px;overflow:hidden;background:linear-gradient(180deg,var(--bg2),var(--bg) 62%);isolation:isolate}
.screen::before{content:"";position:absolute;width:420px;height:420px;left:-120px;top:-160px;background:radial-gradient(circle,rgba(34,230,255,.22),transparent 65%);z-index:-1;pointer-events:none}
.screen::after{content:"";position:absolute;width:380px;height:380px;right:-160px;bottom:60px;background:radial-gradient(circle,rgba(59,130,246,.22),transparent 65%);z-index:-1;pointer-events:none}
.screen .glow3{position:absolute;width:340px;height:340px;left:40%;bottom:-140px;background:radial-gradient(circle,rgba(192,132,252,.16),transparent 65%);z-index:-1;pointer-events:none}
.full .wrap{width:100%;height:100%}
.full .phone{width:100%;height:100%;transform:none!important;border-radius:0;padding:0;box-shadow:none;background:none}
.full .screen{border-radius:0}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:8px 34px 0;font-weight:600;font-size:16px;z-index:30;pointer-events:none}
.sb .ri{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:12px;font-weight:600;overflow:hidden;transition:width .5s cubic-bezier(.2,.9,.3,1.15),height .5s cubic-bezier(.2,.9,.3,1.15);white-space:nowrap}
.island.open{width:290px;height:50px;border-radius:26px}
.island .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 1.6s infinite;flex:none}
.island .txt{opacity:0;max-width:0;transition:opacity .3s .1s}
.island.open .txt{opacity:1;max-width:240px}
.island.warn .dot{background:var(--amber);box-shadow:0 0 10px var(--amber)}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:60px 18px 128px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.view{animation:inR .38s cubic-bezier(.2,.8,.2,1)}
.view.back{animation-name:inL}.view.noanim{animation:none}
@keyframes inR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);font-size:13px;font-weight:600;color:var(--cyan)}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);color:var(--cyan);display:grid;place-items:center}
.large{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:8px 0 4px}
.sub{color:var(--sub);font-size:14px}
.h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:22px 4px 8px;font-weight:600}
.glass{background:var(--card);backdrop-filter:blur(28px) saturate(190%) brightness(1.05);-webkit-backdrop-filter:blur(28px) saturate(190%) brightness(1.05);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.seg{position:relative;display:flex;background:var(--card2);border-radius:11px;padding:2px;margin:14px 0}
.seg i{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:9px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,.9,.3,1)}
.seg[data-idx="1"] i{transform:translateX(100%)}
.seg button{position:relative;flex:1;padding:8px;font-size:14px;font-weight:600;z-index:1}
.hero{padding:20px;position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(145deg,rgba(59,130,246,.5),rgba(34,230,255,.16) 60%,var(--card))}
.chip{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.05em;background:rgba(255,176,32,.18);color:var(--amber);border:1px solid rgba(255,176,32,.4)}
.chip.c{background:rgba(34,230,255,.14);color:var(--cyan);border-color:rgba(34,230,255,.4)}
.chip.g{background:rgba(48,209,88,.14);color:var(--green);border-color:rgba(48,209,88,.4)}
.chip.v{background:rgba(192,132,252,.16);color:var(--violet);border-color:rgba(192,132,252,.4)}
.hero h2{font-size:28px;line-height:1.08;margin:12px 0 6px;letter-spacing:-.02em}
.hero .by{font-size:13px;color:var(--sub)}.hero .by b{display:block;color:var(--text);font-size:14.5px;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.w{padding:14px;text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.w:active{transform:scale(.96)}
.wl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--sub);display:flex;align-items:center;gap:6px}
.wv{font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--cyan)}
.wv.a{color:var(--amber)}.wv.g{color:var(--green)}
.ws{font-size:12px;color:var(--sub)}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:48px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row label{font-size:15px;min-width:86px;color:var(--sub)}
input[type=text],textarea,select{background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;width:100%;resize:none}
select option{color:#000}
textarea{min-height:110px;line-height:1.4}
::placeholder{color:var(--sub);opacity:.7}
.btn{width:100%;padding:15px;border-radius:16px;font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:var(--on);transition:transform .15s,opacity .2s;margin-top:16px}
.btn:active{transform:scale(.97)}.btn.sec{background:var(--card2);color:var(--cyan);border:1px solid var(--line)}.btn[disabled]{opacity:.5}
.btnrow{display:flex;gap:10px}.btnrow .btn{margin-top:16px}
.steps{display:flex;gap:6px;margin:12px 0 4px}
.steps b{flex:1;height:5px;border-radius:3px;background:var(--card2);overflow:hidden;position:relative}
.steps b.on::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--blue),var(--cyan));animation:fill .5s}
@keyframes fill{from{transform:translateX(-100%)}}
.letter{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--on);background:linear-gradient(135deg,var(--amber),#ffd36b);flex:none}
.card{padding:16px}
.two{display:flex;gap:12px;align-items:center}
.two h3{margin:0;font-size:20px}.two p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

    toast(m);setStatus(m);return;
   }
  }

  if(err&&err.code==='declined'){setStatus(x('Descarga cancelada','Download canceled'));return}

  var blob=(data instanceof Blob)?data:new Blob([data],{type:mime||'text/plain'});

 render({noanim:true,keep:true});scrollChat();
}
function scrollChat(){setTimeout(function(){var l=$('#chatlist');if(l)l.scrollTop=l.scrollHeight},50)}
function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
function vCompare(){
 var m=S.cmp.mode,list=m==='fordec'?S.histF:S.histS,sel=m==='fordec'?S.cmp.selF:S.cmp.selS;
 var h='<div class="view'+(S.noanim?' noanim':'')+'">'+topbar()+'<div class="large">'+x('Comparar resultados','Compare results')+'</div><div class="sub">'+x('Revisa tu historial y compara dos intentos','Review your history and compare two attempts')+'</div>'
 +'<div class="seg" data-idx="'+(m==='fordec'?0:1)+'"><i></i><button data-a="cmpmode" data-v="fordec">FORDEC</button><button data-a="cmpmode" data-v="steam">STEAM</button></div>'
 +'<div class="h2">'+x('Historial','History')+' · '+list.length+'</div>';
 if(list.length===0){
  h+='<div class="glass card"><div class="sub">'+x('Aún no hay intentos guardados. Completa una simulación o evaluación para verla aquí.','No attempts saved yet. Complete a simulation or evaluation to see it here.')+'</div></div>';
 } else {
  h+='<div class="list">'+list.map(function(rec,i){return {rec:rec,i:i}}).slice().reverse().map(function(o){
   var rec=o.rec,i=o.i,picked=sel.indexOf(i)>-1;
   var col=rec.score>=80?'var(--green)':rec.score>=60?'var(--amber)':'var(--red)';
   var title=m==='fordec'?trunc(rec.choice,40):rec.topic;
   var sub=m==='fordec'?trunc(rec.facts,54):(LV[rec.level][S.lang]+' · '+rec.dur);
   return '<button class="row '+(picked?'sel':'')+'" data-a="cmpsel" data-v="'+i+'"><span class="radio">'+(picked?ic('check',14,3):'')+'</span><span style="flex:1;min-width:0"><b style="display:block;font-size:14.5px">'+esc(title)+'</b><span style="font-size:12px;color:var(--sub)">'+esc(sub)+'</span></span><span class="badge" style="color:'+col+'">'+rec.score+'</span></button>';
  }).join('')+'</div>'
  +'<div class="sub" style="margin:8px 4px">'+x('Elige hasta 2 para comparar.','Pick up to 2 to compare.')+'</div>'
  +'<button class="btn sec" data-a="cmpclear">'+x('Borrar historial','Clear history')+'</button>';
  if(sel.length===2)h+='<div class="h2">'+x('Comparación','Comparison')+'</div>'+cmpCard(list[sel[0]],list[sel[1]],m);
 }
 return h+'</div>';
}
function cmpCard(A,B,m){
 function colFor(sc){return sc>=80?'var(--green)':sc>=60?'var(--amber)':'var(--red)'}
 function block(rec){
  if(m==='fordec'){
   return '<div class="glass card tint-b" style="flex:1;min-width:0"><div class="wl" style="margin-bottom:4px">'+new Date(rec.ts).toLocaleDateString()+'</div><div style="font-size:26px;font-weight:800;color:'+colFor(rec.score)+'">'+rec.score+'</div><div style="font-size:13px;margin-top:6px"><b>'+x('Decisión','Decision')+':</b> '+esc(trunc(rec.choice,60))+'</div><div style="font-size:12px;color:var(--sub);margin-top:4px">'+x('Riesgo','Risk')+' '+rec.r+' · '+x('Beneficio','Benefit')+' '+rec.b+'</div></div>';
  }
  return '<div class="glass card tint-a" style="flex:1;min-width:0"><div class="wl" style="margin-bottom:4px">'+new Date(rec.ts).toLocaleDateString()+'</div><div style="font-size:26px;font-weight:800;color:'+colFor(rec.score)+'">'+rec.score+'</div><div style="font-size:13px;margin-top:6px"><b>'+x('Tema','Topic')+':</b> '+esc(trunc(rec.topic,50))+'</div><div style="font-size:12px;color:var(--sub);margin-top:4px">'+LV[rec.level][S.lang]+'</div></div>';
 }
 var diff=B.score-A.score;
 return '<div style="display:flex;gap:10px">'+block(A)+block(B)+'</div>'
 +'<div class="glass card" style="margin-top:10px;text-align:center"><div class="wl" style="justify-content:center">Δ '+x('DIFERENCIA','DIFFERENCE')+'</div><div style="font-size:22px;font-weight:800;color:'+(diff>=0?'var(--green)':'var(--red)')+'">'+(diff>0?'+':'')+diff+'</div></div>';
}

function go(t){if(t===S.tab)return;var o=TABS.map(function(z){return z[0]});S.dir=o.indexOf(t)>o.indexOf(S.tab)?1:-1;S.tab=t;closeSheet();render();
 var msgs={home:'ALT 35,000 ft · HDG 247°',sim:'FORDEC · '+x('listo','ready'),crm:'CRM · '+crmProg().p+'%',ai:'STEAM · '+x('evaluador','evaluator'),cmp:x('Comparar · ','Compare · ')+(S.histF.length+S.histS.length)+' '+x('registros','records')};
 island(msgs[t],false,1800)}

function next(){
 var f=S.f;
 if(f.step===0&&f.facts.trim().length<8){bad(x('Registra los hechos (mín. 8 caracteres)','Log the facts (min. 8 characters)'));return}
 if(f.step===1&&f.options.length<2){bad(x('Agrega al menos 2 opciones','Add at least 2 options'));return}
 if(f.step===3&&f.choice<0){bad(x('Selecciona una ruta','Select a route'));return}
 S.dir=1;f.step++;render();island('FORDEC · '+STEPS[f.step].n,false,1600);
}
function bad(m){toast(m);var c=$('.glass.card');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}island(m,true,2000)}
async function genAiScenario(){
 var f=S.f;if(f.scnBusy)return;
 f.scnBusy=true;render({noanim:true,keep:true});
 var prompt=x('Genera UN escenario breve de crisis realista para un aula STEAM (robótica/maker) que un docente pueda usar para practicar el protocolo de aviación FORDEC. Responde SOLO con JSON, sin texto extra, con esta forma exacta: {"facts":"una o dos frases describiendo el problema","options":[{"t":"opción breve","r":0-100 riesgo,"b":0-100 beneficio},{"t":"opción breve","r":n,"b":n},{"t":"opción breve","r":n,"b":n}]}. Escribe en español, tono realista de aula.',
 'Generate ONE brief, realistic crisis scenario for a STEAM (robotics/maker) classroom that a teacher can use to practice the FORDEC aviation protocol. Reply with ONLY JSON, no extra text, in this exact shape: {"facts":"one or two sentences describing the problem","options":[{"t":"short option","r":0-100 risk,"b":0-100 benefit},{"t":"short option","r":n,"b":n},{"t":"short option","r":n,"b":n}]}. Write in English, realistic classroom tone.');
 var res=await askAIJson(prompt,{modelTier:'quick',cache:false});
 f.scnBusy=false;
 if(res.ok&&res.data&&res.data.facts&&Array.isArray(res.data.options)&&res.data.options.length>=2){
  f.facts=String(res.data.facts).slice(0,400);
  f.options=res.data.options.slice(0,4).map(function(o){return {t:String(o.t||'').slice(0,120),r:clampInt(o.r),b:clampInt(o.b)}});
  f.choice=-1;
  render({noanim:true,keep:true});
  island(x('Escenario IA listo ✓','AI scenario ready ✓'),false,2200);
 } else {
  render({noanim:true,keep:true});
  toast(res.code==='not_granted'?x('No diste permiso para usar la IA aquí','You didn\u2019t grant AI permission here'):x('IA no disponible; prueba un escenario demo','AI unavailable; try a demo scenario'));
 }
}

document.addEventListener('pointerdown',function(e){
 var el=e.target.closest('.btn,.iconbtn,.pill,.w,.tab,.chips button,.rh,.row[data-a],.exp-primary');
 if(!el)return;
 try{if(navigator.vibrate)navigator.vibrate(6)}catch(er){}
 var r=el.getBoundingClientRect(),sc=scaleN||1;
 var dl=Math.max(r.width,r.height)/sc;
 var lx=(e.clientX-r.left)/sc-dl/2,ly=(e.clientY-r.top)/sc-dl/2;
 var sp=document.createElement('span');sp.className='rip';sp.style.width=sp.style.height=dl+'px';sp.style.left=lx+'px';sp.style.top=ly+'px';
 el.appendChild(sp);
 setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},600);
});
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,v=el.dataset.v,f=S.f;
 if(a==='tab')go(v);
 else if(a==='lang'){var sg=el.closest('.seg');if(sg)sg.dataset.idx=v==='es'?0:1;S.lang=v;setTimeout(function(){document.documentElement.lang=v;render({noanim:true,keep:true});if(S.ai.res){S.ai.res.dur=DU[S.ai.dur][v]}},180)}
 else if(a==='theme'){S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;render({noanim:true,keep:true})}
 else if(a==='export'){S.exp.tab='code';exportSheet()}
 else if(a==='etab'){S.exp.tab=v;exportSheet()}
 else if(a==='cpcode')copy(getSource(),x('Código copiado','Code copied'));
 else if(a==='cpread')copy(readme(),x('README copiado','README copied'));
 else if(a==='dlcode')saveFile('index.html',getSource(),'text/html');
 else if(a==='dlread')saveFile('README.md',readme(),'text/markdown');
 else if(a==='zipall'){
  var st0=$('#expst');if(st0)st0.textContent=x('Preparando archivo…','Preparing file…');
  buildZip().then(function(blob){
   if(!blob){var st1=$('#expst');if(st1)st1.textContent=x('ZIP no disponible; usa los botones individuales.','ZIP unavailable; use the individual buttons.');return}
   saveFile('plan-de-vuelo-247.zip',blob);
  });
 }
 else if(a==='close')closeSheet();
 else if(a==='next')next();
 else if(a==='prev'){S.dir=-1;f.step=Math.max(0,f.step-1);render()}
 else if(a==='demo'){var sc=SCN[+v];f.facts=sc.f[S.lang];f.options=sc.o.map(function(o){return {t:o.t[S.lang],r:o.r,b:o.b}});f.choice=-1;render({noanim:true,keep:true});island(sc.n[S.lang],true,1800)}
 else if(a==='aiscn')genAiScenario();
 else if(a==='add'){addOpt()}
 else if(a==='del'){f.options.splice(+v,1);f.choice=-1;render({noanim:true,keep:true})}
 else if(a==='choose'){f.choice=+v;render({noanim:true,keep:true})}
 else if(a==='fchk'){f.checks[+v]=!f.checks[+v];render({noanim:true,keep:true})}
 else if(a==='freset'){S.f={step:0,facts:'',options:[],newopt:'',choice:-1,checks:[false,false,false,false],scnBusy:false,coach:{status:'idle',text:''}};S.dir=-1;render()}
 else if(a==='role'){S.crm.open=S.crm.open===+v?-1:+v;render({noanim:true,keep:true})}
 else if(a==='rchk'){var k=el.dataset.r+'-'+v;S.crm.checks[k]=!S.crm.checks[k];render({noanim:true,keep:true});var d=roleProg(+el.dataset.r);if(d===R[+el.dataset.r].i.length)island(R[+el.dataset.r].n[S.lang]+' ✓',false,1800)}
 else if(a==='gest')gestSheet(+v);
 else if(a==='analyze')analyze();
 else if(a==='aimode'){S.aiMode=v;render({noanim:true,keep:true})}
 else if(a==='chatsend')chatSend();
 else if(a==='cmpmode'){S.cmp.mode=v;render({noanim:true,keep:true})}
 else if(a==='cmpsel'){
  var arr=S.cmp.mode==='fordec'?S.cmp.selF:S.cmp.selS,idx=+v,pos=arr.indexOf(idx);
  if(pos>-1)arr.splice(pos,1);else{if(arr.length>=2)arr.shift();arr.push(idx)}
  render({noanim:true,keep:true});
 }
 else if(a==='cmpclear'){
  if(S.cmp.mode==='fordec'){S.histF=[];S.cmp.selF=[];try{localStorage.removeItem('pv247_fordec_hist')}catch(e){}}
  else{S.histS=[];S.cmp.selS=[];try{localStorage.removeItem('pv247_steam_hist')}catch(e){}}
  render({noanim:true,keep:true});toast(x('Historial borrado','History cleared'));
 }
});
function addOpt(){var f=S.f,t=f.newopt.trim();if(!t){var i=$('#newopt');if(i)i.focus();return}f.options.push({t:t,r:50,b:50});f.newopt='';render({noanim:true,keep:true});var i2=$('#newopt');if(i2)i2.focus()}
document.addEventListener('input',function(e){
 var el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
 if(k==='facts')S.f.facts=el.value;
 else if(k==='newopt')S.f.newopt=el.value;
 else if(k==='topic')S.ai.topic=el.value;
 else if(k==='obj')S.ai.obj=el.value;
 else if(k==='level')S.ai.level=+el.value;
 else if(k==='dur')S.ai.dur=+el.value;
 else if(k==='chatmsg')S.chat.input=el.value;
 else if(k==='sl'){var o=S.f.options[+el.dataset.i],val=+el.value;o[el.dataset.k]=val;el.style.setProperty('--v',val+'%');
  if(el.dataset.k==='r')el.style.setProperty('--c',val>66?'var(--red)':val>33?'var(--amber)':'var(--green)');
  el.nextElementSibling.textContent=val}
});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset&&(el.dataset.in==='level'||el.dataset.in==='dur')){S.ai[el.dataset.in]=+el.value}});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target.id==='newopt'){e.preventDefault();addOpt()}
 else if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatin'){e.preventDefault();chatSend()}
});

build();
document.documentElement.dataset.theme=S.theme;
render();
bootSequence();
setTimeout(function(){island('Plan de Vuelo 247 · SEEC 2027',false,2600)},1400);
var alt=35000;
setInterval(function(){alt+=Math.round((Math.random()-.5)*60);var el=$('#alt');if(el)el.textContent=alt.toLocaleString('en-US');var el2=$('#alt2');if(el2)el2.textContent=alt.toLocaleString('en-US')},1200);
var msgs=['ALT 35,000 ft · HDG 247°','CRM · '+'ON','FORDEC · STANDBY'];var mi=0;
setInterval(function(){if(S.tab==='home'&&!$('#sheet').classList.contains('on')){mi=(mi+1)%msgs.length;island(msgs[mi],mi===2,2200)}},9000);
})();
